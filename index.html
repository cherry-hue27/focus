from IPython.display import HTML

html_code = """
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus 專注時計</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: rgba(22, 27, 46, 0.7);
            --primary-neon: #00ffcc;
            --secondary-neon: #ff007f;
            --text-color: #e0e6ed;
            --text-dim: #7889a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #1a1c2e 0%, #0d0e15 100%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: var(--primary-neon);
            text-shadow: 0 0 10px var(--primary-neon);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .timer-display {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-ring {
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .ring-progress {
            fill: none;
            stroke: var(--primary-neon);
            stroke-width: 8;
            stroke-dasharray: 565;
            stroke-dashoffset: 0;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
            filter: drop-shadow(0 0 8px var(--primary-neon));
        }

        .time-text {
            position: absolute;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            background: transparent;
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 15px var(--primary-neon);
        }

        button.secondary {
            border-color: var(--secondary-neon);
            color: var(--secondary-neon);
        }

        button.secondary:hover {
            background: var(--secondary-neon);
            color: #fff;
            box-shadow: 0 0 15px var(--secondary-neon);
        }

        .sound-section {
            margin-bottom: 25px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .sound-title {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .sound-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-section h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .task-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-neon);
        }

        .task-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .task-item {
            background: rgba(255,255,255,0.03);
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .task-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .task-item.completed {
            text-decoration: line-through;
            color: var(--text-dim);
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FOCUS SYNTH</h1>
    
    <div class="timer-display">
        <svg class="svg-ring" width="200" height="200">
            <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
            <circle class="ring-progress" id="progress-bar" cx="100" cy="100" r="90"></circle>
        </svg>
        <div class="time-text" id="time-display">25:00</div>
    </div>

    <div class="timer-controls">
        <button id="start-btn">開始專注</button>
        <button id="reset-btn" class="secondary">重置</button>
        <button id="mode-btn" class="secondary">切換休息</button>
    </div>

    <div class="sound-section">
        <div class="sound-toggle">
            <span class="sound-title">白噪音 (Synth Noise)</span>
            <button id="audio-btn" style="padding: 5px 12px; font-size: 0.8rem;">開啟音效</button>
        </div>
    </div>

    <div class="task-section">
        <h3>當前專注任務</h3>
        <div class="task-input-group">
            <input type="text" id="task-input" placeholder="新增一個目標...">
            <button id="add-task-btn">+</button>
        </div>
        <ul class="task-list" id="task-list"></ul>
    </div>
</div>

<script>
    let workTime = 25 * 60;
    let breakTime = 5 * 60;
    let currentTime = workTime;
    let isWorkMode = true;
    let timerId = null;
    let isRunning = false;
    const totalCircumference = 2 * Math.PI * 90;

    const timeDisplay = document.getElementById('time-display');
    const progressBar = document.getElementById('progress-bar');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const modeBtn = document.getElementById('mode-btn');
    const taskInput = document.getElementById('task-input');
    const addTaskBtn = document.getElementById('add-task-btn');
    const taskList = document.getElementById('task-list');
    const audioBtn = document.getElementById('audio-btn');

    function updateDisplay() {
        const mins = Math.floor(currentTime / 60).toString().padStart(2, '0');
        const secs = (currentTime % 60).toString().padStart(2, '0');
        timeDisplay.textContent = `${mins}:${secs}`;

        const maxTime = isWorkMode ? workTime : breakTime;
        const offset = totalCircumference - (currentTime / maxTime) * totalCircumference;
        progressBar.style.strokeDashoffset = offset;
    }

    function startTimer() {
        if (isRunning) {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = '繼續';
        } else {
            isRunning = true;
            startBtn.textContent = '暫停';
            timerId = setInterval(() => {
                if (currentTime > 0) {
                    currentTime--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    isRunning = false;
                    alert(isWorkMode ? '專注時間結束！休息一下吧。' : '休息結束，準備開始下一個階段！');
                    switchMode();
                }
            }, 1000);
        }
    }

    function resetTimer() {
        clearInterval(timerId);
        isRunning = false;
        currentTime = isWorkMode ? workTime : breakTime;
        startBtn.textContent = '開始專注';
        updateDisplay();
    }

    function switchMode() {
        isWorkMode = !isWorkMode;
        modeBtn.textContent = isWorkMode ? '切換休息' : '切換專注';
        progressBar.style.stroke = isWorkMode ? 'var(--primary-neon)' : 'var(--secondary-neon)';
        resetTimer();
    }

    function addTask() {
        const text = taskInput.value.trim();
        if (!text) return;

        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `<span>${text}</span><span>✕</span>`;
        
        li.addEventListener('click', (e) => {
            if (e.target.textContent === '✕') {
                li.remove();
            } else {
                li.classList.toggle('completed');
            }
        });

        taskList.appendChild(li);
        taskInput.value = '';
    }

    let audioCtx, noiseNode;
    let isPlayingAudio = false;

    function toggleAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (isPlayingAudio) {
            audioCtx.suspend();
            audioBtn.textContent = '開啟音效';
            isPlayingAudio = false;
        } else {
            audioCtx.resume();
            if (!noiseNode) {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;

                const gain = audioCtx.createGain();
                gain.gain.value = 0.05;

                noiseNode.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noiseNode.start();
            }
            audioBtn.textContent = '關閉音效';
            isPlayingAudio = true;
        }
    }

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);
    modeBtn.addEventListener('click', switchMode);
    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
    audioBtn.addEventListener('click', toggleAudio);

    updateDisplay();
</script>
</body>
</html>
"""

HTML(html_code)
